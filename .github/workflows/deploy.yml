name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

  image:
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve image name
        id: image
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image }}

  deploy:
    runs-on: ubuntu-latest
    needs: image
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust deployment host
        shell: bash
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload Compose definition
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: scp docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.yml"

      - name: Migrate, deploy, verify, and roll back on failure
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' IMAGE='$IMAGE' GHCR_USERNAME='$GHCR_USERNAME' GHCR_TOKEN='$GHCR_TOKEN' sh -s" <<'REMOTE'
          set -eu
          cd "$DEPLOY_PATH"
          previous_image="$(cat .last-good-image 2>/dev/null || true)"

          resolved_compose="$(APP_IMAGE="$IMAGE" docker compose config)"
          for insecure_value in \
            local-admin-password \
            local-cdk-password \
            AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            http://localhost:4174
          do
            if printf '%s\n' "$resolved_compose" | grep -Fq "$insecure_value"; then
              echo "Production Compose configuration still contains a local default" >&2
              exit 1
            fi
          done
          if ! printf '%s\n' "$resolved_compose" | grep -Eq 'AUTH_SECURE_COOKIES: "?true"?$'; then
            echo "Production deployment requires AUTH_SECURE_COOKIES=true" >&2
            exit 1
          fi

          rollback() {
            if [ -n "$previous_image" ]; then
              echo "Deployment failed; restoring $previous_image"
              docker pull "$previous_image"
              APP_IMAGE="$previous_image" docker compose up -d --no-deps api worker
            fi
          }
          trap rollback EXIT

          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          docker pull "$IMAGE"
          APP_IMAGE="$IMAGE" docker compose up -d db
          APP_IMAGE="$IMAGE" docker compose run --rm migrate
          APP_IMAGE="$IMAGE" docker compose up -d --no-deps api
          APP_IMAGE="$IMAGE" docker compose up -d --no-deps worker

          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/health/ready >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          printf '%s\n' "$IMAGE" > .last-good-image
          trap - EXIT
          REMOTE
